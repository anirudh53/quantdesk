# Cloud schedule: runs schedule/tick.py, which decides what is due in each market's own timezone
# (open 08:30 / midday 12:30 / close 16:30 / scan 17:30 market time) and skips anything already done.
# GitHub cron is UTC-only and often starts 5-30 min late, so these times cover India (IST, fixed)
# and the US in both EDT and EST.
name: quantdesk

on:
  schedule:
    - cron: "7 3,7,11,12 * * 1-5"                  # India: 08:37 / 12:37 / 16:37 / 17:37 IST
    - cron: "37 12,13,16,17,20,21,22 * * 1-5"      # US: 08:37 / 12:37 / 16:37 / 17:37 ET (EDT and EST)
    - cron: "47 0 * * *"                           # Crypto: daily, after the 00:00 UTC close (also on weekends)
  workflow_dispatch:
    inputs:
      job:
        description: "What to run (auto = whatever is due now)"
        type: choice
        default: auto
        options: [auto, US close, IN close, US scan, IN scan, crypto, dashboard only]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quantdesk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Run due jobs
        run: |
          case "${{ inputs.job || 'auto' }}" in
            auto)             python schedule/tick.py ;;
            "US close")       python -m pipeline.run_daily --market US --mode close ;;
            "IN close")       python -m pipeline.run_daily --market IN --mode close ;;
            "US scan")        python -m pipeline.scan --market US ;;
            "IN scan")        python -m pipeline.scan --market IN ;;
            crypto)           python -m pipeline.crypto ;;
            "dashboard only") true ;;
          esac

      - name: Save reports to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data config/scan_universe.yaml
          if ! git diff --cached --quiet; then
            git commit -q -m "reports $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull -q --rebase && git push -q
          fi

      - name: Build site
        if: always()
        run: |
          python -m pipeline.dashboard
          mkdir -p site && cp dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4

      - name: Alert on failure
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -s -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"Quantdesk run failed\",\"message\":\"A scheduled run had an error. Tap to see the log. The next scheduled run retries automatically.\",\"tags\":[\"warning\"],\"click\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" https://ntfy.sh/ > /dev/null
